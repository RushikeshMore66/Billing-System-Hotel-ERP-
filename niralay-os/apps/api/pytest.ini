[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
markers =
    unit: Pure unit tests (no I/O)
    integration: Tests that require a running database
    slow: Tests that take > 1 second
